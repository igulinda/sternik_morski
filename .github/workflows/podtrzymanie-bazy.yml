name: Podtrzymanie bazy Supabase

# Darmowy projekt Supabase jest usypiany po tygodniu bez aktywności.
# Ten automat co 3 dni wywołuje funkcję ping() (nie zwraca żadnych danych),
# żeby baza nie zasnęła, gdy rodzina zrobi przerwę w nauce.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
            'https://dpvdqfzyqjkthgvxszaf.supabase.co/rest/v1/rpc/ping' \
            -H 'apikey: sb_publishable_HEpES3DlVreH_yKIMUU1Bw_WfB6ad_Z' \
            -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $code: $(cat /tmp/out)"
          test "$code" = "200"
